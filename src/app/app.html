<div class="app">
  <header class="app__header">
    <h1 class="app__title">Zlecenia</h1>
    <button
      type="button"
      class="theme-toggle"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.theme() === 'dark' ? 'Przełącz na motyw jasny' : 'Przełącz na motyw ciemny'"
    >
      {{ theme.theme() === 'dark' ? '☀️ Jasny' : '🌙 Ciemny' }}
    </button>
  </header>

  <main class="app__content">
    <app-orders-table />
    <app-order-form />
  </main>
</div>
