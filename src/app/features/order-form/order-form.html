<form class="order-form" [formGroup]="form" (ngSubmit)="submit()">
  <h2 class="order-form__title">Nowe zlecenie</h2>

  <div class="order-form__fields">
    <label class="field">
      <span class="field__label">Symbol</span>
      <select formControlName="symbol">
        <option value="" disabled>Wybierz symbol</option>
        @for (symbol of store.symbols(); track symbol) {
          <option [value]="symbol">{{ symbol }}</option>
        }
      </select>
      @if (hasError('symbol')) {
        <span class="field__error">Symbol jest wymagany</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Side</span>
      <select formControlName="side">
        @for (side of sides; track side) {
          <option [value]="side">{{ side }}</option>
        }
      </select>
    </label>

    <label class="field">
      <span class="field__label">Size</span>
      <input type="number" formControlName="size" min="0" step="0.01" />
      @if (hasError('size')) {
        <span class="field__error">Podaj wartość większą od 0</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Open Price</span>
      <span class="field__with-action">
        <input type="number" formControlName="openPrice" min="0" step="any" />
        <button
          type="button"
          class="field__action"
          (click)="applyCurrentPrice(form.controls.symbol.value)"
          [disabled]="!form.controls.symbol.value"
          title="Pobierz aktualną cenę"
        >
          ⟳
        </button>
      </span>
      @if (hasError('openPrice')) {
        <span class="field__error">Podaj cenę większą od 0</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Open Time</span>
      <input type="datetime-local" formControlName="openTime" step="1" />
      @if (hasError('openTime')) {
        <span class="field__error">Data otwarcia jest wymagana</span>
      }
    </label>

    <button type="submit" class="order-form__submit" [disabled]="form.invalid">
      Dodaj zlecenie
    </button>
  </div>
</form>
